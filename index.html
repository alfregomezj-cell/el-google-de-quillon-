<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quillón en Línea</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            width: 100%;
            overflow-x: hidden;
        }

        /* --- BARRA SUPERIOR CONSTANTE (MÁXIMA PROTECCIÓN) --- */
        .top-action-bar {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 15px 16px 10px 16px;
            background-color: #ffffff;
            box-sizing: border-box;
            width: 100%;
            position: relative;
        }

        /* Bloque Izquierdo y Centro (INTACTO Y PROTEGIDO) */
        .left-search-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
            max-width: 240px; 
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 14px;
            flex-shrink: 0;
        }

        .menu-line {
            width: 100%;
            height: 2px;
            background-color: #1d1d1f; 
            border-radius: 1px;
        }

        .search-brand-group {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: flex-end; 
            width: 100%;
            position: relative;
        }

        .search-block-icon {
            color: #1d1d1f;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            margin-right: 6px; 
            margin-bottom: 2px;
        }

        .search-svg-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-line-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            position: relative;
            min-width: 0;
        }

        .search-hint-text {
            color: #86868b; 
            font-size: 10px;
            font-weight: 500;
            text-align: left;
            padding-left: 2px;
            margin-bottom: 1px; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-consecutive-line {
            width: 100%;
            height: 1.5px;
            background-color: #1d1d1f; 
            margin-bottom: 2px; 
        }

        /* --- BOTÓN DE EMERGENCIA FIJO AL EXTREMO DE LA DERECHA --- */
        .emergencia-container {
            position: relative;
            display: inline-block;
            flex-shrink: 0;
        }

        .emergencia-btn {
            background-color: #ffffff;
            border: none;
            padding: 4px 0;
            cursor: pointer;
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 2px;               
        }

        .emergency-top-text {
            color: #e31c1c;
            font-size: 8px; 
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1;
        }

        .emergency-bottom-row {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #e31c1c;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .emergencia-icon {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Tarjeta flotante absoluta controlada dinámicamente */
        .emergencia-panel-dropdown {
            display: none; 
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background-color: #ffffff;
            width: 260px;
            border-radius: 8px;
            border: 1px solid #e8e8ed;
            box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.15);
            box-sizing: border-box;
            z-index: 9999; 
        }

        .emergencia-panel-dropdown.show {
            display: block;
        }

        .dropdown-header {
            background-color: #f5f5f7;
            padding: 10px 14px 6px 14px;
            font-size: 10px;
            text-transform: uppercase;
            color: #86868b;
            font-weight: 700;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #e8e8ed;
        }

        .emergencia-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            text-decoration: none;
            color: #1d1d1f;
            font-size: 12px;
            border-bottom: 1px solid #e8e8ed;
            background-color: #ffffff;
        }

        .emergencia-item:last-child {
            border-bottom: none;
        }

        .emergencia-number {
            font-weight: 700;
            color: #e31c1c;
            background-color: #ffe3e3;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
        }

        .emergencia-placeholder {
            font-weight: 500;
            color: #86868b;
            background-color: #e8e8ed;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
        }

        /* --- ENCABEZADO MEJORADO TOTALMENTE EXPUESTO --- */
        .title-container {
            width: 100%;
            padding: 20px 16px;
            box-sizing: border-box;
            background-color: #ffffff;
        }

        .store-title {
            font-size: 36px; 
            font-weight: 700;
            color: #1d1d1f; /* Quillón en negro fijo */
            letter-spacing: -0.5px;
            margin: 0;
        }

        /* Animación lineal de 0.44s aplicada estrictamente a "en Línea" */
        .animated-text {
            display: inline-block;
            background: linear-gradient(to right, #1d1d1f 50%, #e31c1c 50%);
            background-size: 200% 100%;
            background-position: 0% 0%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorWipe 0.44s linear 0.1s forwards;
        }

        @keyframes colorWipe {
            0% { background-position: 0% 0%; }
            100% { background-position: -100% 0%; }
        }
    </style>
</head>
<body>
