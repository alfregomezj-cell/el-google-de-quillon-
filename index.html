<html lang="es">
<head>

    <title>Quillón en Línea</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* --- BARRA SUPERIOR (MÁXIMA PROTECCIÓN) --- */
        .top-action-bar {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 24px 28px 10px 28px;
            background-color: #ffffff;
        }

        /* Agrupa menú y buscador a la izquierda manteniendo distancias intactas */
        .left-search-cluster {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-grow: 1;
            max-width: 282px; 
        }

        /* Botón de menú de tres líneas (INTACTO Y PROTEGIDO) */
        .menu-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 14px;
            flex-shrink: 0;
        }

        .menu-line {
            width: 100%;
            height: 2px;
            background-color: #1d1d1f; 
            border-radius: 1px;
        }

        /* Bloque del Buscador Global (INTACTO Y PROTEGIDO) */
        .search-brand-group {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: flex-end; 
            width: 100%;
            transition: opacity 0.2s ease;
        }

        .search-brand-group:hover {
            opacity: 0.7;
        }

        .search-block-icon {
            color: #1d1d1f;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            margin-right: 6px; 
        }

        .search-svg-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-consecutive-line {
            flex-grow: 1; 
            height: 1.5px;
            background-color: #1d1d1f; 
            margin-bottom: 2px; 
        }

        /* --- INTEGRACIÓN DE TU CÓDIGO DE EMERGENCIA EN LA DERECHA (ADAPTADO AL ESTILO LIMPIO) --- */
        .emergencia-container {
            position: relative;
            display: inline-block;
        }

        /* Botón principal adaptado a la estética minimalista del sitio */
        .emergencia-btn {
            background-color: #ffffff;
            color: #e31c1c; /* Rojo para destacar urgencia */
            border: none;
            padding: 6px 0;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s ease;
        }

        .emergencia-btn:hover {
            opacity: 0.6;
        }

        .emergencia-icon {
            width: 16px;
            height: 16px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Casilla Desplegable de tu ejemplo intacta */
        .emergencia-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 12px);
            background-color: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            min-width: 280px;
            box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            overflow: hidden;
            z-index: 9999;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .emergencia-container:hover .emergencia-dropdown {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-header {
            background-color: #f5f5f7;
            padding: 12px 16px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #86868b;
            border-bottom: 1px solid #e8e8ed;
            font-weight: 700;
        }

        .emergencia-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            text-decoration: none;
            color: #1d1d1f;
            font-size: 13px;
            border-bottom: 1px solid #f5f5f7;
            transition: background-color 0.2s ease;
        }

        .emergencia-item:last-child {
            border-bottom: none;
        }

        .emergencia-item:hover {
            background-color: #fff5f5; 
        }

        .emergencia-label {
            font-weight: 500;
        }

        .emergencia-number {
            font-weight: 700;
            color: #e31c1c;
            background-color: #ffe3e3;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
        }

        /* --- SECCIÓN DEL TÍTULO (MÁXIMA PROTECCIÓN - INTACTO) --- */
        .main-header {
            text-align: left;
            padding: 36px 28px 10px 28px; 
            background-color: #ffffff;
        }

        .store-title {
            font-size: 40px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .animated-text {
            display: inline-block;
            background: linear-gradient(to right, #1d1d1f 50%, #e31c1c 50%);
            background-size: 200% 100%;
            background-position: 0% 0%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorWipe 0.44s linear 0.1s forwards;
        }

        @keyframes colorWipe {
            0% { background-position: 0% 0%; }
            100% { background-position: -100% 0%; }
        }
    </style>
</head>
