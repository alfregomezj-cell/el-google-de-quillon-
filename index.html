        function generateStars(rating) {
            let html = '';
            for (let i = 1; i <= 5; i++) {
                if (i <= Math.floor(rating)) {
                    html += `<i class="fas fa-star text-[#F15C22] mr-0.5"></i>`;
                } else if (i - 0.5 <= rating) {
                    html += `<i class="fas fa-star-half-alt text-[#F15C22] mr-0.5"></i>`;
                } else {
                    html += `<i class="far fa-star text-[#E7E7E7] mr-0.5"></i>`;
                }
            }
            return html;
        }

                                    item.subcat.toLowerCase().includes(appState.search.toLowerCase());
