<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quillón en Línea</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .main-header {
            text-align: left;
            padding: 40px 24px 10px 24px;
            background-color: #ffffff;
        }

        .store-title {
            font-size: 40px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .animated-text {
            display: inline-block;
            background: linear-gradient(to right, #1d1d1f 50%, #e31c1c 50%);
            background-size: 200% 100%;
            background-position: 0% 0%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            
            /* Cambiado de 2.5s a 1.2s para un barrido más rápido */
            animation: colorWipe 1.2s ease-in-out forwards;
        }

        @keyframes colorWipe {
            0% {
                background-position: 0% 0%;
            }
            100% {
                background-position: -100% 0%;
            }
        }
    </style>
</head>
<body>

    <header class="main-header">
        <h1 class="store-title">Quillón <span class="animated-text">en Línea</span></h1>
    </header>

</body>
</html>
