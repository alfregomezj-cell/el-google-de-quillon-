<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quillón en Línea</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Contenedor superior distribuido para el menú y el buscador global */
        .top-action-bar {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 28px 28px 0 28px;
            background-color: #ffffff;
            gap: 20px;
        }

        /* Botón de menú de tres líneas (INTACTO Y PROTEGIDO) */
        .menu-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 14px;
            flex-shrink: 0; 
        }

        .menu-line {
            width: 100%;
            height: 2px;
            background-color: #1d1d1f; 
            border-radius: 1px;
        }

        /* Buscador Global Potente integrado en la línea naranja */
        .top-search-wrapper {
            display: flex;
            align-items: center;
            background-color: #f5f5f7; 
            border-radius: 8px;
            padding: 6px 12px;
            width: 100%;
            max-width: 220px; 
        }

        .top-search-icon {
            font-size: 14px;
            color: #86868b;
            margin-right: 8px;
        }

        .top-search-input {
            border: none;
            background: transparent;
            font-size: 13px;
            color: #1d1d1f;
            outline: none;
            width: 100%;
        }

        .top-search-input::placeholder {
            color: #86868b;
        }

        /* --- SECCIÓN DEL TÍTULO (100% INTACTO Y PROTEGIDO) --- */
        .main-header {
            text-align: left;
            padding: 36px 28px 10px 28px; 
            background-color: #ffffff;
        }

        .store-title {
            font-size: 40px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .animated-text {
            display: inline-block;
            background: linear-gradient(to right, #1d1d1f 50%, #e31c1c 50%);
            background-size: 200% 100%;
            background-position: 0% 0%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorWipe 0.44s linear 0.1s forwards;
        }

        @keyframes colorWipe {
            0% { background-position: 0% 0%; }
            100% { background-position: -100% 0%; }
        }
    </style>
</head>
<body>

    <!-- Zona superior con el menú y el Buscador Global en la línea naranja -->
    <div class="top-action-bar">
        <button class="menu-toggle-btn" aria-label="Abrir menú">
            <span class="menu-line"></span>
            <span class="menu-line"></span>
            <span class="menu-line"></span>
        </button>

        <!-- Buscador preparado para filtrar cabañas, restaurantes, servicios y emergencias -->
        <div class="top-search-wrapper">
            <span class="top-search-icon">🔍</span>
            <input type="text" id="global-search-input" class="top-search-input" placeholder="Buscar cabañas, servicios...">
        </div>
    </div>

    <!-- El encabezado original protegido -->
    <header class="main-header">
        <h1 class="store-title">Quillón <span class="animated-text">en Línea</span></h1>
    </header>

</body>
</html>
