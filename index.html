<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quillón en Línea</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Contenedor flexible con posición relativa para asegurar el centro absoluto */
        .top-action-bar {
            position: relative;
            display: flex;
            align-items: center;
            height: 40px;
            padding: 28px 28px 0 28px;
            background-color: #ffffff;
        }

        /* Lado Izquierdo: Menú de tres líneas fijo en su posición (INTACTO) */
        .left-menu-container {
            position: absolute;
            left: 28px;
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 14px;
        }

        .menu-line {
            width: 100%;
            height: 2px;
            background-color: #1d1d1f; 
            border-radius: 1px;
        }

        /* CENTRO ABSOLUTO: El bloque se posiciona exactamente en la mitad matemática de la pantalla */
        .center-search-group {
            position: absolute;
            left: 50%;
            transform: translateX(-50%); /* Empuja el eje al centro exacto */
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Botón de la lupa sutil (INTACTO) */
        .global-search-trigger {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1d1d1f;
        }

        .search-svg-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Línea sutil al lado de la lupa */
        .search-divider-line {
            width: 1px;
            height: 16px;
            background-color: #d2d2d7; 
        }

        /* --- SECCIÓN DEL TÍTULO (100% INTACTO Y PROTEGIDO) --- */
        .main-header {
            text-align: left;
            padding: 36px 28px 10px 28px; 
            background-color: #ffffff;
        }

        .store-title {
            font-size: 40px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .animated-text {
            display: inline-block;
            background: linear-gradient(to right, #1d1d1f 50%, #e31c1c 50%);
            background-size: 200% 100%;
            background-position: 0% 0%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorWipe 0.44s linear 0.1s forwards;
        }

        @keyframes colorWipe {
            0% { background-position: 0% 0%; }
            100% { background-position: -100% 0%; }
        }
    </style>
</head>
<body>

    <div class="top-action-bar">
        <!-- Izquierda: Menú de tres líneas fijo en su esquina original -->
        <div class="left-menu-container">
            <button class="menu-toggle-btn" aria-label="Abrir menú">
                <span class="menu-line"></span>
                <span class="menu-line"></span>
                <span class="menu-line"></span>
            </button>
        </div>

        <!-- Centro Absoluto: Lupa y línea alineadas perfectamente en el medio -->
        <div class="center-search-group">
            <button class="global-search-trigger" id="global-search-btn" aria-label="Buscar en la comuna">
                <svg class="search-svg-icon" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>
            <div class="search-divider-line"></div>
        </div>
    </div>

    <!-- El encabezado original protegido -->
    <header class="main-header">
        <h1 class="store-title">Quillón <span class="animated-text">en Línea</span></h1>
    </header>

</body>
</html>
