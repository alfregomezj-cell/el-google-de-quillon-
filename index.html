<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quillón en Línea</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* --- BARRA SUPERIOR (PROTEGIDA) --- */
        .top-action-bar {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 24px 28px 10px 28px;
            background-color: #ffffff;
        }

        /* Agrupa menú y buscador a la izquierda (PROTEGIDO) */
        .left-search-cluster {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-grow: 1;
            max-width: 282px; 
        }

        /* Botón de menú de tres líneas (INTACTO Y PROTEGIDO) */
        .menu-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 14px;
            flex-shrink: 0;
        }

        .menu-line {
            width: 100%;
            height: 2px;
            background-color: #1d1d1f; 
            border-radius: 1px;
        }

        /* Bloque del Buscador Global (INTACTO Y PROTEGIDO) */
        .search-brand-group {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: flex-end; 
            width: 100%;
            transition: opacity 0.2s ease;
        }

        .search-brand-group:hover {
            opacity: 0.7;
        }

        .search-block-icon {
            color: #1d1d1f;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            margin-right: 6px; 
        }

        .search-svg-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-consecutive-line {
            flex-grow: 1; 
            height: 1.5px;
            background-color: #1d1d1f; 
            margin-bottom: 2px; 
        }

        /* --- BOTÓN DE EMERGENCIA CON APILAMIENTO VERTICAL --- */
        .emergencia-container {
            position: relative;
            display: inline-block;
        }

        .emergencia-btn {
            background-color: #ffffff;
            border: none;
            padding: 4px 0;
            cursor: pointer;
            display: flex;
            flex-direction: column; /* Apila los elementos verticalmente */
            align-items: center;    /* Centra la palabra sobre el 24/7 */
            gap: 2px;               /* Espacio sutil entre textos */
            transition: opacity 0.2s ease;
        }

        .emergencia-btn:hover {
            opacity: 0.6;
        }

        /* CORREGIDO: Palabra emergencia arriba en letras chicas dentro del largo */
        .emergency-top-text {
            color: #e31c1c;
            font-size: 8px; /* Letras adecuadamente más chicas */
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1;
        }

        /* Contenedor inferior para mantener el ícono y el 24/7 tal cual estaban */
        .emergency-bottom-row {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #e31c1c;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .emergencia-icon {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Casilla Desplegable (PROTEGIDA) */
        .emergencia-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 12px);
            background-color: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            min-width: 280px;
            box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.08);
            border-radius: 12px;
            overflow: hidden;
            z-index: 9999;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .emergencia-container:hover .emergencia-dropdown {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-header {
            background-color: #f5f5f7;
            padding: 12px 16px;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #86868b;
            border-bottom: 1px solid #e8e8ed;
            font-weight: 700;
        }

        .emergencia-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
            text-decoration: none;
            color: #1d1d1f;
            font-size: 13px;
            border-bottom: 1px solid #f5f5f7;
            transition: background-color 0.2s ease;
        }

        .emergencia-item:last-child {
            border-bottom: none;
        }

        .emergencia-item:hover {
            background-color: #fff5f5; 
        }

        .emergencia-label {
            font-weight: 500;
        }

        .emergencia-number {
            font-weight: 700;
            color: #e31c1c;
            background-color: #ffe3e3;
            padding: 3px 8px;
            border-radius: 5px;
            font-size: 12px;
        }

        /* --- SECCIÓN DEL TÍTULO (PROTEGIDO) --- */
        .main-header {
            text-align: left;
            padding: 36px 28px 10px 28px; 
            background-color: #ffffff;
        }

        .store-title {
            font-size: 40px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .animated-text {
            display: inline-block;
            background: linear-gradient(to right, #1d1d1f 50%, #e31c1c 50%);
            background-size: 200% 100%;
            background-position: 0% 0%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorWipe 0.44s linear 0.1s forwards;
        }

        @keyframes colorWipe {
            0% { background-position: 0% 0%; }
            100% { background-position: -100% 0%; }
        }
    </style>
</head>
<body>

    <div class="top-action-bar">
        <!-- Bloque Izquierdo/Centro protegido -->
        <div class="left-search-cluster">
            <button class="menu-toggle-btn" onclick="abrirMenuAccion()" aria-label="Abrir menú">
                <span class="menu-line"></span>
                <span class="menu-line"></span>
                <span class="menu-line"></span>
            </button>

            <button class="search-brand-group" id="global-search-trigger" onclick="ejecutarBusquedaGlobal()" aria-label="Activar búsqueda global">
                <div class="search-block-icon">
                    <svg class="search-svg-icon" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <div class="search-consecutive-line"></div>
            </button>
        </div>

        <!-- Bloque Derecho: Estructura vertical con la palabra arriba -->
        <div class="emergencia-container">
            <button class="emergencia-btn">
                <span class="emergency-top-text">Emergencia</span>
                <div class="emergency-bottom-row">
                    <svg class="emergencia-icon" viewBox="0 0 24 24">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <span>24/7</span>
                </div>
            </button>

            <!-- Panel de números locales protegido -->
            <div class="emergencia-dropdown">
                <div class="dropdown-header">Números Locales (Quillón)</div>
                <a href="tel:133" class="emergencia-item"><span class="emergencia-label">🚨 Carabineros</span><span class="emergencia-number">133</span></a>
                <a href="tel:132" class="emergencia-item"><span class="emergencia-label">🚒 Bomberos</span><span class="emergencia-number">132</span></a>
                <a href="tel:131" class="emergencia-item"><span class="emergencia-label">🚑 Ambulancia / SAMU</span><span class="emergencia-number">131</span></a>
                <a href="tel:+56983234343" class="emergencia-item"><span class="emergencia-label">🛡️ Seguridad Municipal</span><span class="emergencia-number">Celular</span></a>
                <a href="tel:+56979094252" class="emergencia-item"><span class="emergencia-label">🚙 Grúas Locales 24/7</span><span class="emergencia-number">Llamar</span></a>
            </div>
        </div>
    </div>

    <!-- Título original protegido -->
