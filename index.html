<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quillón en Línea</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            width: 100%;
            overflow-x: hidden;
        }

        /* --- BARRA SUPERIOR CONSTANTE (MÁXIMA PROTECCIÓN) --- */
        .top-action-bar {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 15px 16px 10px 16px;
            background-color: #ffffff;
            box-sizing: border-box;
            width: 100%;
        }

        .left-search-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
            max-width: 240px; 
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 14px;
            flex-shrink: 0;
        }

        .menu-line {
            width: 100%;
            height: 2px;
            background-color: #1d1d1f; 
            border-radius: 1px;
        }

        .search-brand-group {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: flex-end; 
            width: 100%;
            position: relative;
        }

        .search-block-icon {
            color: #1d1d1f;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            margin-right: 6px; 
            margin-bottom: 2px;
        }

        .search-svg-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-line-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            position: relative;
            min-width: 0;
        }

        .search-hint-text {
            color: #86868b; 
            font-size: 10px;
            font-weight: 500;
            text-align: left;
            padding-left: 2px;
            margin-bottom: 1px; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-consecutive-line {
            width: 100%;
            height: 1.5px;
            background-color: #1d1d1f; 
            margin-bottom: 2px; 
        }
