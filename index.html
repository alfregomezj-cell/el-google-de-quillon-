<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quillón en Línea</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Contenedor de la barra superior */
        .top-action-bar {
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            padding: 24px 28px 10px 28px;
            background-color: #ffffff;
            gap: 20px;
        }

        /* Botón de menú de tres líneas (PROTEGIDO) */
        .menu-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 14px;
            flex-shrink: 0;
        }

        .menu-line {
            width: 100%;
            height: 2px;
            background-color: #1d1d1f; 
            border-radius: 1px;
        }

        /* Bloque del buscador (PROTEGIDO) */
        .search-brand-group {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: flex-end; 
            width: 100%;
            max-width: 240px; 
            transition: opacity 0.2s ease;
        }

        .search-brand-group:hover {
            opacity: 0.7;
        }

        .search-block-icon {
            color: #1d1d1f;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            margin-right: 6px; 
        }

        .search-svg-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-consecutive-line {
            flex-grow: 1; 
            height: 1.5px;
            background-color: #1d1d1f; 
            margin-bottom: 2px; 
        }

        /* --- SECCIÓN DEL TÍTULO (PROTEGIDO) --- */
        .main-header {
            text-align: left;
            padding: 36px 28px 10px 28px; 
            background-color: #ffffff;
        }

        .store-title {
            font-size: 40px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .animated-text {
            display: inline-block;
            background: linear-gradient(to right, #1d1d1f 50%, #e31c1c 50%);
            background-size: 200% 100%;
            background-position: 0% 0%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorWipe 0.44s linear 0.1s forwards;
        }

        @keyframes colorWipe {
            0% { background-position: 0% 0%; }
            100% { background-position: -100% 0%; }
        }
    </style>
</head>
<body>

    <div class="top-action-bar">
        <!-- Menú de tres líneas con evento listo -->
        <button class="menu-toggle-btn" onclick="abrirMenuAccion()" aria-label="Abrir menú">
            <span class="menu-line"></span>
            <span class="menu-line"></span>
            <span class="menu-line"></span>
        </button>

        <!-- Bloque del Buscador Global con evento listo -->
        <button class="search-brand-group" id="global-search-trigger" onclick="ejecutarBusquedaGlobal()" aria-label="Activar búsqueda global">
            <div class="search-block-icon">
                <svg class="search-svg-icon" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>
            <div class="search-consecutive-line"></div>
        </button>
    </div>

    <header class="main-header">
        <h1 class="store-title">Quillón <span class="animated-text">en Línea</span></h1>
    </header>

    <script>
        // Mensaje preparado para el menú de acción posterior
        function abrirMenuAccion() {
            console.log("Sistema listo: Esperando parámetros para desplegar el menú de acción.");
        }

        // Mensaje preparado para la línea del buscador global potente
        function ejecutarBusquedaGlobal() {
            console.log("Sistema listo: Buscador preparado para filtrar términos dentro de Quillón.");
        }
    </script>

</body>
</html>
