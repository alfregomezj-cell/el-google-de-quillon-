<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quillón en Línea</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Contenedor de la barra superior */
        .top-action-bar {
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            padding: 24px 28px 16px 28px; /* Espacio interno calibrado */
            background-color: #ffffff;
            gap: 24px; /* Espacio directo entre el menú y la lupa pegada */
        }

        /* Botón de menú de tres líneas (INTACTO Y PROTEGIDO) */
        .menu-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 14px;
        }

        .menu-line {
            width: 100%;
            height: 2px;
            background-color: #1d1d1f; 
            border-radius: 1px;
        }

        /* Botón de la lupa sutil pegado a la izquierda */
        .global-search-trigger {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1d1d1f;
        }

        .search-svg-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* NUEVO: Línea divisoria horizontal larga que cruza toda la pantalla */
        .horizontal-divider-line {
            width: 100%;
            height: 1px;
            background-color: #e8e8ed; /* Gris claro muy limpio y sutil */
        }

        /* --- SECCIÓN DEL TÍTULO (100% INTACTO Y PROTEGIDO) --- */
        .main-header {
            text-align: left;
            padding: 32px 28px 10px 28px; /* Ajustado el margen superior con la línea */
            background-color: #ffffff;
        }

        .store-title {
            font-size: 40px;
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .animated-text {
            display: inline-block;
            background: linear-gradient(to right, #1d1d1f 50%, #e31c1c 50%);
            background-size: 200% 100%;
            background-position: 0% 0%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorWipe 0.44s linear 0.1s forwards;
        }

        @keyframes colorWipe {
            0% { background-position: 0% 0%; }
            100% { background-position: -100% 0%; }
        }
    </style>
</head>
<body>

    <!-- 1. Fila de navegación superior (Menú y Lupa pegados) -->
    <div class="top-action-bar">
        <!-- Menú de tres líneas -->
        <button class="menu-toggle-btn" aria-label="Abrir menú">
            <span class="menu-line"></span>
            <span class="menu-line"></span>
            <span class="menu-line"></span>
        </button>

        <!-- Lupa de búsqueda pegada al lado -->
        <button class="global-search-trigger" id="global-search-btn" aria-label="Buscar en la comuna">
            <svg class="search-svg-icon" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </button>
    </div>

    <!-- 2. Línea divisoria horizontal completa de tu trazo naranja -->
    <div class="horizontal-divider-line"></div>

    <!-- 3. El encabezado original protegido -->
    <header class="main-header">
        <h1 class="store-title">Quillón <span class="animated-text">en Línea</span></h1>
    </header>

</body>
</html>
