<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quillón en Línea</title>
    <style>
        /* Estilos base obligatorios */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            width: 100%;
            overflow-x: hidden;
        }

        /* --- BARRA SUPERIOR CONSTANTE --- */
        .top-action-bar {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 15px 16px 10px 16px;
            background-color: #ffffff;
            box-sizing: border-box;
            width: 100%;
        }

        /* Bloque Izquierdo y Centro (INTACTO Y PROTEGIDO) */
        .left-search-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
            max-width: 240px; 
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 14px;
            flex-shrink: 0;
        }

        .menu-line {
            width: 100%;
            height: 2px;
            background-color: #1d1d1f; 
            border-radius: 1px;
        }

        .search-brand-group {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: flex-end; 
            width: 100%;
            position: relative;
        }

        .search-block-icon {
            color: #1d1d1f;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            margin-right: 6px; 
            margin-bottom: 2px;
        }

        .search-svg-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-line-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            position: relative;
            min-width: 0;
        }

        .search-hint-text {
            color: #86868b; 
            font-size: 10px;
            font-weight: 500;
            text-align: left;
            padding-left: 2px;
            margin-bottom: 1px; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-consecutive-line {
            width: 100%;
            height: 1.5px;
            background-color: #1d1d1f; 
            margin-bottom: 2px; 
        }

        /* Bloque Derecho de Emergencias (INTACTO) */
        .emergencia-container {
            position: relative;
            display: inline-block;
            flex-shrink: 0;
        }

        .emergencia-btn {
            background-color: #ffffff;
            border: none;
            padding: 4px 0;
            cursor: pointer;
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 2px;               
        }

        .emergency-top-text {
            color: #e31c1c;
            font-size: 8px; 
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1;
        }

        .emergency-bottom-row {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #e31c1c;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .emergencia-icon {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Casilla Desplegable */
        .emergencia-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background-color: #ffffff;
            min-width: 290px; 
            box-shadow: 0px 8px 30px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            overflow: hidden;
            z-index: 9999;
            border: 1px solid rgba(0, 0, 0, 0.06);
        }

        .emergencia-container:hover .emergencia-dropdown {
            display: block;
        }

        .dropdown-header {
            background-color: #f5f5f7;
            padding: 10px 14px;
            font-size: 11px;
            text-transform: uppercase;
            color: #86868b;
            border-bottom: 1px solid #e8e8ed;
            font-weight: 700;
        }

        .emergencia-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            text-decoration: none;
            color: #1d1d1f;
            font-size: 13px;
            border-bottom: 1px solid #f5f5f7;
        }

        .emergencia-item:last-child {
            border-bottom: none;
        }

        .emergencia-number {
            font-weight: 700;
            color: #e31c1c;
            background-color: #ffe3e3;
            padding: 3px 6px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
        }

        /* --- ENCABEZADO FIJO DE ALTA VISIBILIDAD --- */
        .main-header {
            text-align: left;
            padding: 20px 16px 10px 16px; 
            background-color: #ffffff;
            box-sizing: border-box;
            width: 100%;
        }

        .store-title {
            font-size: 36px; 
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .animated-text {
            display: inline-block;
            background: linear-gradient(to right, #1d1d1f 50%, #e31c1c 50%);
            background-size: 200% 100%;
            background-position: 0% 0%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorWipe 0.44s linear 0.1s forwards;
        }

        @keyframes colorWipe {
            0% { background-position: 0% 0%; }
            100% { background-position: -100% 0%; }
        }
    </style>
</head>
<body>

    <!-- Barra superior -->
    <div class="top-action-bar">
        <div class="left-search-cluster">
            <button class="menu-toggle-btn" onclick="abrirMenuAccion()">
                <span class="menu-line"></span>
                <span class="menu-line"></span>
                <span class="menu-line"></span>
            </button>

            <button class="search-brand-group" id="global-search-trigger" onclick="ejecutarBusquedaGlobal()">
                <div class="search-block-icon">
                    <svg class="search-svg-icon" viewBox="0 0 24 24">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </div>
                <div class="search-line-container">
                    <span class="search-hint-text">Restaurantes, cabañas, vulcanización...</span>
                    <div class="search-consecutive-line"></div>
                </div>
            </button>
        </div>

        <div class="emergencia-container">
            <button class="emergencia-btn">
                <span class="emergency-top-text">Emergencia</span>
                <div class="emergency-bottom-row">
                    <svg class="emergencia-icon" viewBox="0 0 24 24">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <span>24/7</span>
                </div>
            </button>

            <!-- Menú desplegable completo -->
            <div class="emergencia-dropdown">
                <div class="dropdown-header">Números Locales (Quillón)</div>
                
                <a href="tel:4222842140" class="emergencia-item">
                    <span class="emergencia-label">🚨 Carabineros Quillón</span>
                    <span class="emergencia-number">(42) 284 2140</span>
                </a>
                
                <a href="tel:4222842140" class="emergencia-item">
                    <span class="emergencia-label">🚒 Bomberos Quillón</span>
                    <span class="emergencia-number">(42) 284 2140</span>
                </a>
                
                <a href="tel:4222842140" class="emergencia-item">
                    <span class="emergencia-label">🧑‍🚒 Cuarta Compañía</span>
                    <span class="emergencia-number">(42) 284 2140</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Título principal estabilizado -->
    <header class="main-header">
        <h1 class="store-title">Quillón <span class="animated-text">en Línea</span></h1>
    </header>

    <script>
        function abrirMenuAccion() { console.log("Menú de acción listo."); }
        function ejecutarBusquedaGlobal() { console.log("Buscador global listo."); }
    </script>
</body>
</html>
