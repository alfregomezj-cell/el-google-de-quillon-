<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quillón en Línea</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background-color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            width: 100%;
            overflow-x: hidden;
        }

        /* --- BARRA SUPERIOR CONSTANTE (MÁXIMA PROTECCIÓN) --- */
        .top-action-bar {
            display: flex;
            justify-content: space-between; 
            align-items: center;
            padding: 15px 16px 10px 16px;
            background-color: #ffffff;
            box-sizing: border-box;
            width: 100%;
        }

        .left-search-cluster {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-grow: 1;
            max-width: 240px; 
        }

        .menu-toggle-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 22px;
            height: 14px;
            flex-shrink: 0;
        }

        .menu-line {
            width: 100%;
            height: 2px;
            background-color: #1d1d1f; 
            border-radius: 1px;
        }

        .search-brand-group {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: flex-end; 
            width: 100%;
            position: relative;
        }

        .search-block-icon {
            color: #1d1d1f;
            display: flex;
            align-items: center;
            flex-shrink: 0;
            margin-right: 6px; 
            margin-bottom: 2px;
        }

        .search-svg-icon {
            width: 18px;
            height: 18px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .search-line-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            position: relative;
            min-width: 0;
        }

        .search-hint-text {
            color: #86868b; 
            font-size: 10px;
            font-weight: 500;
            text-align: left;
            padding-left: 2px;
            margin-bottom: 1px; 
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-consecutive-line {
            width: 100%;
            height: 1.5px;
            background-color: #1d1d1f; 
            margin-bottom: 2px; 
        }

        /* --- NUEVO CONTENEDOR NATIVO DE EMERGENCIA (INFALIBLE) --- */
        .emergencia-details-wrapper {
            display: inline-block;
            flex-shrink: 0;
        }

        /* Quita la flecha nativa de los navegadores */
        .emergencia-details-wrapper summary::-webkit-details-marker {
            display: none;
        }
        .emergencia-details-wrapper summary {
            list-style: none;
            outline: none;
        }

        .emergencia-btn {
            background-color: #ffffff;
            border: none;
            padding: 4px 0;
            cursor: pointer;
            display: flex;
            flex-direction: column; 
            align-items: center;    
            gap: 2px;               
        }

        .emergency-top-text {
            color: #e31c1c;
            font-size: 8px; 
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            line-height: 1;
        }

        .emergency-bottom-row {
            display: flex;
            align-items: center;
            gap: 4px;
            color: #e31c1c;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .emergencia-icon {
            width: 14px;
            height: 14px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Panel de números locales integrado de forma estricta en el flujo de la página */
        .emergencia-panel-visible {
            background-color: #f5f5f7;
            margin: 5px 16px;
            border-radius: 8px;
            border: 1px solid #e8e8ed;
            box-sizing: border-box;
            width: calc(100% - 32px);
        }

        .dropdown-header {
            padding: 10px 14px 6px 14px;
            font-size: 10px;
            text-transform: uppercase;
            color: #86868b;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .emergencia-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            text-decoration: none;
            color: #1d1d1f;
            font-size: 13px;
            border-bottom: 1px solid #e8e8ed;
        }

        .emergencia-item:last-child {
            border-bottom: none;
        }

        .emergencia-number {
            font-weight: 700;
            color: #e31c1c;
            background-color: #ffe3e3;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 11px;
            white-space: nowrap;
        }

        .emergencia-placeholder {
            font-weight: 500;
            color: #86868b;
            background-color: #e8e8ed;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            white-space: nowrap;
        }

        /* --- ENCABEZADO FIJO TOTALMENTE PROTEGIDO --- */
        .main-header {
            text-align: left;
            padding: 20px 16px 10px 16px; 
            background-color: #ffffff;
            box-sizing: border-box;
            width: 100%;
        }

        .store-title {
            font-size: 36px; 
            font-weight: 700;
            color: #1d1d1f;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .animated-text {
            display: inline-block;
            background: linear-gradient(to right, #1d1d1f 50%, #e31c1c 50%);
            background-size: 200% 100%;
            background-position: 0% 0%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: colorWipe 0.44s linear 0.1s forwards;
        }

        @keyframes colorWipe {
            0% { background-position: 0% 0%; }
            100% { background-position: -100% 0%; }
        }
    </style>
</head>
