<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quillón en Línea - El Yelp de la Comuna</title>
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <link href="https://googleapis.com" rel="stylesheet">
    <script>
        window.tailwindConfig = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Open Sans', 'sans-serif'] },
                    colors: {
                        yelp: { red: '#DA1A29', hoverRed: '#B2121E', dark: '#111212', grayBg: '#F5F5F5', border: '#E7E7E7', textGray: '#6E7072', starGold: '#F15C22', blueLink: '#0073BB' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Open Sans', sans-serif; background-color: #F5F5F5; color: #111212; margin: 0; -webkit-font-smoothing: antialiased; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .badge-open { background-color: #F2F9F3; color: #107A32; }
        .badge-closed { background-color: #FFF2F3; color: #C9212D; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-[#F5F5F5] min-h-screen text-[#111212]">
        <script>
        const database = [
            { id: 1, nombre: "Complejo Turístico Laguna Esmeralda Artificial", categoria: "turismo", subcat: "Cabañas con Guardia y Cámaras", rating: 4.8, opinionesCount: 142, precio: 3, direccion: "Av. Circunvalación #1820, sector Laguna", telefono: "+56911112222", abierto: true, premium: true, emergencia: false, tags: ["Piscina", "Seguridad 24/7", "Cámaras", "Vista al Lago"], infoAdicional: ["Cabañas Equipadas: $55.000 CLP / Noche"], coords: { lat: -36.7412, lng: -72.4789 }, reviews: { usuario: "Carlos M.", texto: "Excelente seguridad y las cámaras dan total tranquilidad.", estrellas: 5 } },
            { id: 2, nombre: "Parrilladas y Carnes El Fuego Criollo Artificial", categoria: "gastronomia", subcat: "Parrilladas y Comida Rápida", rating: 4.6, opinionesCount: 89, precio: 2, direccion: "Bernardo O'Higgins #720, Quillón Urbano", telefono: "+56933334444", abierto: true, premium: true, emergencia: false, tags: ["Delivery", "Terraza", "Vinos de la Zona"], infoAdicional: ["Parrillada Premium: $28.000 CLP"], coords: { lat: -36.7445, lng: -72.4755 }, reviews: { usuario: "Pedro S.", texto: "El reparto a las cabañas llegó caliente.", estrellas: 5 } },
            { id: 3, nombre: "Vulcanización y Asistencia Central 24/7 Artificial", categoria: "servicios", subcat: "Vulcanizaciones 24/7", rating: 4.9, opinionesCount: 64, precio: 2, direccion: "Ruta N-48, Km 2.1 (Ingreso a Quillón)", telefono: "+56955556666", abierto: true, premium: true, emergencia: true, tags: ["Atención Domingo", "Servicio en Ruta"], infoAdicional: ["Atención Inmediata 24 Horas"], coords: { lat: -36.7210, lng: -72.4912 }, reviews: { usuario: "Juan K.", texto: "Me salvaron un domingo en la madrugada.", estrellas: 5 } },
            { id: 4, nombre: "Viña Ancestral Los Valles Ocultos Artificial", categoria: "turismo", subcat: "Viñas abiertas hoy", rating: 4.7, opinionesCount: 37, precio: 3, direccion: "Camino Cerro Negro, Km 4.5", telefono: "+56977778888", abierto: false, premium: true, emergencia: false, tags: ["Catas Guiadas", "Turismo Invierno"], infoAdicional: ["Tour con Enólogo: $15.000 CLP"], coords: { lat: -36.7522, lng: -72.4631 }, reviews: { usuario: "Marta R.", texto: "Muy buena la cata de vinos.", estrellas: 4 } },
            { id: 5, nombre: "Panadería y Pastelería Delicias del Pueblo Artificial", categoria: "gastronomia", subcat: "Pastelerías", rating: 4.1, opinionesCount: 4, precio: 1, direccion: "Vicente Méndez #140", telefono: "", abierto: true, premium: false, emergencia: false, tags: ["Local Físico"], infoAdicional: [], coords: { lat: -36.7431, lng: -72.4761 }, reviews: { usuario: "Anonimo", texto: "Buen pan.", estrellas: 4 } }
        ];
        let appState = { cat: 'todos', search: '', precio: 'todos', abiertoOnly: false };
        function generateStars(rating) {
            let html = ''; for (let i = 1; i <= 5; i++) { html += i <= Math.floor(rating) ? `<i class="fas fa-star text-[#F15C22] mr-0.5"></i>` : `<i class="far fa-star text-[#E7E7E7] mr-0.5"></i>`; } return html;
        }
        function filterAndRender() {
            const container = document.getElementById('main-directory-render'); if(!container) return; container.innerHTML = '';
            const filtered = database.filter(item => {
                const mCat = appState.cat === 'todos' || item.categoria === appState.cat;
                const mSearch = item.nombre.toLowerCase().includes(appState.search.toLowerCase()) || item.tags.some(t => t.toLowerCase().includes(appState.search.toLowerCase())) || item.subcat.toLowerCase().includes(appState.search.toLowerCase());
                const mPrice = appState.precio === 'todos' || item.precio === parseInt(appState.precio);
                const mOpen = !appState.abiertoOnly || item.abierto;
                return mCat && mSearch && mPrice && mOpen;
            });
            filtered.sort((a, b) => (b.emergencia - a.emergencia) || (b.premium - a.premium));
            document.getElementById('global-counter').innerText = `${filtered.length} locales listados`;
            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-16 bg-white border rounded-xl"><p class="text-[#6E7072] font-bold">Sin resultados en Quillón.</p></div>`; return;
            }
            filtered.forEach(item => {
                const priceIndicator = "$".repeat(item.precio); let html = '';
                if (item.emergencia) {
                    html = `<div class="bg-red-50 border-2 border-[#DA1A29] rounded-xl p-5 mb-4 flex flex-col md:flex-row justify-between items-center gap-4 fade-in"><div class="flex items-center gap-3"><div><span class="bg-[#DA1A29] text-white text-[9px] font-black px-2 py-0.5 rounded">TURNO 24/7</span><h3 class="text-lg font-black text-[#111212] mt-1">${item.nombre}</h3><p class="text-xs text-red-700 font-bold">${item.subcat}</p><p class="text-xs text-gray-500">${item.direccion}</p></div></div><a href="tel:${item.telefono}" class="w-full md:w-auto bg-[#DA1A29] text-white text-xs font-black px-4 py-3 rounded-lg text-center shadow-sm">LLAMAR POR EMERGENCIA</a></div>`;
                } else if (item.premium) {
                    html = `<div class="bg-white border rounded-xl p-5 mb-4 shadow-sm relative fade-in"><div class="absolute top-0 right-0 bg-amber-500 text-white text-[9px] font-black px-2 py-0.5 rounded-bl-lg">PREMIUM</div><div class="flex flex-col sm:flex-row gap-4"><div class="w-full sm:w-32 h-24 bg-gray-100 rounded border flex items-center justify-center text-gray-400 text-2xl shrink-0"><i class="fas fa-store"></i></div><div class="flex-1"><span class="text-[10px] text-gray-400 font-bold uppercase block">${item.subcat}</span><h3 class="text-base font-bold text-[#111212] mt-0.5">${item.nombre}</h3><div class="flex items-center gap-2 mt-0.5"><div class="flex text-xs">${generateStars(item.rating)}</div><span class="text-xs text-gray-500">(${item.opinionesCount} opiniones) • ${priceIndicator}</span></div><p class="text-xs text-gray-500 mt-1"><i class="fas fa-map-marker-alt"></i> ${item.direccion}</p><div class="mt-2 bg-gray-50 p-2 rounded text-xs text-gray-600"><strong>Última opinión:</strong> "${item.reviews.texto}"</div><div class="mt-3 pt-2 border-t flex justify-between items-center"><a href="tel:${item.telefono}" class="bg-[#DA1A29] text-white text-xs font-bold px-3 py-1.5 rounded">Contactar</a><button onclick="alert('Ubicación: ' + '${item.nombre}')" class="border text-xs font-bold px-3 py-1.5 rounded bg-white">Ver Mapa</button></div></div></div></div>`;
                } else {
                    html = `<div class="bg-white border rounded-xl p-4 mb-2 opacity-80 shadow-sm"><span class="text-[9px] text-gray-400 uppercase block">${item.subcat}</span><h4 class="text-sm font-bold text-gray-700">${item.nombre}</h4><p class="text-xs text-gray-400 mt-0.5">${item.direccion}</p></div>`;
                } container.innerHTML += html;
            });
        }
        function setPrimaryCategory(c, el) { appState.cat = c; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('border-[#DA1A29]', 'text-[#DA1A29]')); el.classList.add('border-[#DA1A29]', 'text-[#DA1A29]'); filterAndRender(); }
        function handleSearchInput(v) { appState.search = v; filterAndRender(); }
        function setPriceFilter(el) { appState.precio = el.value; filterAndRender(); }
        function toggleOpenState(el) { appState.abiertoOnly = el.checked; filterAndRender(); }
        window.onload = () => { filterAndRender(); };
    </script>
        <header class="bg-white border-b sticky top-0 z-50 px-4 py-3 shadow-sm">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <div class="bg-[#DA1A29] text-white w-8 h-8 rounded-lg flex items-center justify-center font-black text-lg">Q!</div>
                <div class="flex flex-col"><span class="text-base font-black text-[#111212] leading-none">Quillón<span class="text-[#DA1A29]">enLínea</span></span><span class="text-[9px] text-gray-400 font-bold tracking-wider mt-0.5">El Google de la Comuna</span></div>
            </div>
            <div class="flex w-full sm:max-w-md border rounded-lg overflow-hidden bg-white shadow-inner"><input oninput="handleSearchInput(this.value)" type="text" placeholder="Buscar vulcanizaciones, cabañas, servicios..." class="w-full px-3 py-2 text-xs bg-white text-[#111212] focus:outline-none"><button onclick="filterAndRender()" class="bg-[#DA1A29] text-white px-4 text-xs font-bold transition-colors">Buscar</button></div>
        </div>
    </header>
    <div class="bg-white border-b px-4 shadow-sm overflow-x-auto scrollbar-hide sticky top-[57px] z-40">
        <div class="max-w-6xl mx-auto flex gap-4 text-xs">
            <button onclick="setPrimaryCategory('todos', this)" class="tab-btn py-3 border-b-2 border-[#DA1A29] text-[#DA1A29] font-bold whitespace-nowrap focus:outline-none">Todo el Pueblo</button>
            <button onclick="setPrimaryCategory('gastronomia', this)" class="tab-btn py-3 border-b-2 border-transparent text-gray-500 whitespace-nowrap focus:outline-none">Gastronomía</button>
            <button onclick="setPrimaryCategory('servicios', this)" class="tab-btn py-3 border-b-2 border-transparent text-gray-500 whitespace-nowrap focus:outline-none">Servicios y Turnos</button>
            <button onclick="setPrimaryCategory('turismo', this)" class="tab-btn py-3 border-b-2 border-transparent text-gray-500 whitespace-nowrap focus:outline-none">Turismo y Vino</button>
        </div>
    </div>
    <main class="max-w-3xl mx-auto px-4 py-4">
        <div class="bg-white border rounded-xl p-3 mb-4 flex flex-wrap items-center justify-between gap-3 shadow-sm text-xs">
            <div class="flex items-center gap-3 font-bold"><label class="text-gray-500">Costo:</label><select onchange="setPriceFilter(this)" class="bg-gray-50 border rounded px-2 py-0.5 font-bold text-gray-700 focus:outline-none"><option value="todos">Todos</option><option value="1">$</option><option value="2">$$</option><option value="3">$$$</option></select><div class="flex items-center gap-1"><input type="checkbox" onchange="toggleOpenState(this)" class="w-3.5 h-3.5 accent-[#DA1A29] cursor-pointer"><label class="text-gray-500 cursor-pointer">Abierto Ahora</label></div></div><span id="global-counter" class="font-bold text-gray-400">Analizando...</span>
        </div>
        <div id="main-directory-render" class="min-h-[400px]"></div>
    </main>
</body>
</html>
